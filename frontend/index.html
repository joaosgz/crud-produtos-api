<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Gerenciamento de Produtos</h1>

        <p>
            Sistema CRUD utilizando Array
        </p>

    </header>


    <main>

        <section class="formulario">

            <h2 id="tituloFormulario">
                Cadastrar Produto
            </h2>

            <form id="produtoForm">

                <input
                    type="hidden"
                    id="produtoId"
                >

                <div class="campo">

                    <label for="nome">
                        Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="categoria">
                        Categoria
                    </label>

                    <input
                        type="text"
                        id="categoria"
                        placeholder="Digite a categoria"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="preco">
                        Preço
                    </label>

                    <input
                        type="number"
                        id="preco"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="estoque">
                        Estoque
                    </label>

                    <input
                        type="number"
                        id="estoque"
                        placeholder="Quantidade"
                        required
                    >

                </div>


                <div class="botoes">

                    <button type="submit">
                        Salvar Produto
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="cancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>


        <section class="lista">

            <div class="titulo-lista">

                <h2>
                    Produtos cadastrados
                </h2>

                <button onclick="carregarProdutos()">
                    Atualizar
                </button>

            </div>


            <div id="listaProdutos">

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
